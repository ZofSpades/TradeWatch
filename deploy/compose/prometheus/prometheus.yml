# Prometheus configuration for the compose stack.
#
# Every TradeWatch service serves /metrics on its admin port. Targets are
# found through Docker's embedded DNS, which answers a service name with
# the address of every replica, so `docker compose up --scale detector=N`
# needs no change here and no access to the Docker socket.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: marketsim
    dns_sd_configs:
      - names: [marketsim]
        type: A
        port: 8090
        refresh_interval: 10s

  - job_name: ingest
    dns_sd_configs:
      - names: [ingest]
        type: A
        port: 8091
        refresh_interval: 10s

  - job_name: detector
    dns_sd_configs:
      - names: [detector]
        type: A
        port: 8092
        refresh_interval: 10s

  - job_name: alertsink
    dns_sd_configs:
      - names: [alertsink]
        type: A
        port: 8093
        refresh_interval: 10s

  - job_name: api
    dns_sd_configs:
      - names: [api]
        type: A
        port: 8094
        refresh_interval: 10s

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
