# The detectors, a consumer group sharing the market_events partitions.
# They run the rules baked into the image from rules/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: detector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8092"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: detector
          image: tradewatch/backend:local
          command: ["detector"]
          env:
            - name: TW_KAFKA_BROKERS
              value: kafka:9092
            - name: TW_HTTP_ADDR
              value: ":8092"
          ports:
            - name: admin
              containerPort: 8092
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Voluntary disruptions, such as node drains, take one detector at a time.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: detector
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: detector
