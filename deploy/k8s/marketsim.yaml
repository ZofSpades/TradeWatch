# The simulated exchange, configured like the compose stack. One instance:
# a second would run a second, independent market. Its admin port also
# serves the simulator's control API, which the api service proxies for
# admins.
apiVersion: v1
kind: Service
metadata:
  name: marketsim
spec:
  selector:
    app.kubernetes.io/name: marketsim
  ports:
    - name: admin
      port: 8090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketsim
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: marketsim
  template:
    metadata:
      labels:
        app.kubernetes.io/name: marketsim
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8090"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: marketsim
          image: tradewatch/backend:local
          command: ["marketsim"]
          env:
            - name: TW_KAFKA_BROKERS
              value: kafka:9092
            - name: TW_SIM_PACE
              value: realtime
            - name: TW_SIM_SPEED
              value: "1"
            - name: TW_SIM_SESSION_DURATION
              value: 30m
            - name: TW_SIM_CLOSING_WINDOW
              value: 3m
            - name: TW_SIM_RECORD_DIR
              value: /recordings
            # About one record in 2,000 is corrupted on purpose, so the
            # dead-letter topic and sequence-gap handling stay visible.
            - name: TW_SIM_MALFORMED_RATE
              value: "0.0005"
            # Injected abuse: expected episodes per symbol per trading hour,
            # and the probability that a symbol's close is marked in a
            # session.
            - name: TW_SIM_INJECT_WASH_TRADING
              value: "0.6"
            - name: TW_SIM_INJECT_SPOOFING
              value: "0.6"
            - name: TW_SIM_INJECT_MOMENTUM_IGNITION
              value: "0.4"
            - name: TW_SIM_INJECT_QUOTE_STUFFING
              value: "0.6"
            - name: TW_SIM_INJECT_MARKING_THE_CLOSE
              value: "0.25"
            - name: TW_HTTP_ADDR
              value: ":8090"
          ports:
            - name: admin
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /readyz
              port: admin
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: admin
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Session recordings, for `replay`. Mount a PersistentVolumeClaim
            # here to keep them across restarts.
            - name: recordings
              mountPath: /recordings
      volumes:
        - name: recordings
          emptyDir: {}
