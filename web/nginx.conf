# Serves the dashboard and proxies /api to the API, so the app and the API
# share one origin and need no CORS.
#
# This file is a template: the image's entrypoint substitutes the
# environment variables below (and leaves nginx's own variables alone).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The resolvers of the container's /etc/resolv.conf: Docker's DNS in
    # compose, the cluster DNS in Kubernetes. Looking the API up per request,
    # rather than once at start-up, keeps the proxy working when the API is
    # recreated with a new address.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    location /api/ {
        set $api_upstream ${TW_API_UPSTREAM};
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Server-sent events must reach the browser as they are written.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Built assets have content hashes in their names.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
