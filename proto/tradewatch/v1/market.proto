syntax = "proto3";

package tradewatch.v1;

import "tradewatch/v1/refdata.proto";

option go_package = "github.com/ZofSpades/tradewatch/internal/events/twpb;twpb";

// Conventions used throughout this package:
//   * Prices are fixed-point integers in units of 1/10,000 of the quote
//     currency, so 1_250_000 represents 125.0000.
//   * Quantities are whole shares.
//   * Times are Unix nanoseconds. "Event time" is the simulated exchange
//     clock; "published"/"ingested" times are wall-clock and are used only
//     for latency measurement.

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_LIMIT = 1;
  ORDER_TYPE_MARKET = 2;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  // Rests on the book until filled, cancelled or the session ends.
  TIME_IN_FORCE_DAY = 1;
  // Immediate-or-cancel: fills what it can, the remainder is cancelled.
  TIME_IN_FORCE_IOC = 2;
  // Fill-or-kill: fills in full immediately or not at all.
  TIME_IN_FORCE_FOK = 3;
}

enum OrderAction {
  ORDER_ACTION_UNSPECIFIED = 0;
  ORDER_ACTION_NEW = 1;
  // Cancel/replace of a resting order (price and/or quantity change).
  ORDER_ACTION_REPLACE = 2;
}

enum CancelReason {
  CANCEL_REASON_UNSPECIFIED = 0;
  // Requested by the participant.
  CANCEL_REASON_USER = 1;
  // Unfilled remainder of an IOC order.
  CANCEL_REASON_IOC_REMAINDER = 2;
  // FOK order that could not be filled in full.
  CANCEL_REASON_FOK_UNFILLED = 3;
  // Unfilled remainder of a market order.
  CANCEL_REASON_NO_LIQUIDITY = 4;
  // DAY order expired at the end of the session.
  CANCEL_REASON_SESSION_END = 5;
}

enum TradingPhase {
  TRADING_PHASE_UNSPECIFIED = 0;
  TRADING_PHASE_CONTINUOUS = 1;
  // Final minutes of the session during which the closing reference price
  // is formed.
  TRADING_PHASE_CLOSING = 2;
  TRADING_PHASE_CLOSED = 3;
}

// EventHeader is carried by every market event. The triple
// (session_id, symbol, seq) uniquely identifies an event.
message EventHeader {
  string session_id = 1;
  string symbol = 2;
  // Per (session_id, symbol) sequence number assigned by the matching
  // engine. It starts at 1 and is gap-free across the orders, cancels,
  // trades and book_snapshots topics, which lets consumers restore the
  // exchange's total order for a symbol after reading several topics.
  uint64 seq = 3;
  int64 event_time_ns = 4;
  int64 published_at_ns = 5;
}

// OrderEvent is published on the `orders` topic when the engine accepts a new
// order or a cancel/replace. Executions that result from it follow as
// TradeEvents with higher sequence numbers.
message OrderEvent {
  EventHeader header = 1;
  OrderAction action = 2;
  // Exchange-assigned identifier, unique within (session_id, symbol).
  uint64 order_id = 3;
  string account_id = 4;
  Side side = 5;
  OrderType type = 6;
  TimeInForce time_in_force = 7;
  // Limit price; zero for market orders.
  int64 price = 8;
  // NEW: order quantity. REPLACE: the new open quantity.
  int64 quantity = 9;
  // REPLACE only: price before the replace.
  int64 previous_price = 10;
  // REPLACE only: open quantity before the replace.
  int64 previous_quantity = 11;
}

// CancelEvent is published on the `cancels` topic whenever open quantity is
// removed from the book without trading.
message CancelEvent {
  EventHeader header = 1;
  uint64 order_id = 2;
  string account_id = 3;
  Side side = 4;
  int64 price = 5;
  // Open quantity removed by this cancel.
  int64 cancelled_quantity = 6;
  CancelReason reason = 7;
  // Event time at which the order was originally accepted.
  int64 order_entry_time_ns = 8;
}

// TradeEvent is published on the `trades` topic for every execution. The
// price is always the resting (passive) order's price.
message TradeEvent {
  EventHeader header = 1;
  // Exchange-assigned identifier, unique within (session_id, symbol).
  uint64 trade_id = 2;
  int64 price = 3;
  int64 quantity = 4;
  Side aggressor_side = 5;
  uint64 buy_order_id = 6;
  uint64 sell_order_id = 7;
  string buy_account_id = 8;
  string sell_account_id = 9;
  // Open quantity left on each order after this fill.
  int64 buy_leaves_quantity = 10;
  int64 sell_leaves_quantity = 11;
}

message PriceLevel {
  int64 price = 1;
  int64 quantity = 2;
  uint32 order_count = 3;
}

// BookSnapshot is published on the `book_snapshots` topic periodically and on
// every trading-phase change. It occupies a sequence number so that consumers
// know exactly which events it reflects.
message BookSnapshot {
  EventHeader header = 1;
  TradingPhase phase = 2;
  // Best (highest) bid first.
  repeated PriceLevel bids = 3;
  // Best (lowest) ask first.
  repeated PriceLevel asks = 4;
  int64 last_trade_price = 5;
  int64 session_volume = 6;
}

// SequenceGap is emitted by ingest in place of events that could not be
// delivered (for example, records sent to the dead-letter topic), so that
// downstream consumers always observe a contiguous sequence.
message SequenceGap {
  // header.seq is the first missing sequence number.
  EventHeader header = 1;
  // Last missing sequence number (inclusive).
  uint64 last_seq = 2;
  string reason = 3;
}

message AccountRef {
  string account_id = 1;
  string beneficial_owner_id = 2;
  string entity_id = 3;
  AccountKind kind = 4;
}

// Enrichment is reference data attached by ingest.
message Enrichment {
  // Orders and cancels.
  AccountRef account = 1;
  // Trades.
  AccountRef buy_account = 2;
  AccountRef sell_account = 3;
  LiquidityTier liquidity_tier = 4;
  int64 tick_size = 5;
}

// MarketEvent is the normalized, enriched envelope that ingest publishes on
// the `market_events` topic, in per-symbol sequence order.
message MarketEvent {
  oneof body {
    OrderEvent order = 1;
    CancelEvent cancel = 2;
    TradeEvent trade = 3;
    BookSnapshot book = 4;
    SequenceGap gap = 5;
  }
  Enrichment enrichment = 10;
  int64 ingested_at_ns = 11;
}
