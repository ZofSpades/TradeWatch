name: tradewatch

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Every Go service runs from the same image; `command` picks the binary.
x-backend: &backend
  image: tradewatch/backend:local
  build:
    context: .
  restart: unless-stopped
  logging: *default-logging

services:
  kafka:
    image: apache/kafka:4.2.2
    hostname: kafka
    environment:
      CLUSTER_ID: TradeWatchLocalKRaft0w
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    ports:
      - "127.0.0.1:29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 20s
      retries: 30
      start_period: 10s
    logging: *default-logging

  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_DB: tradewatch
      POSTGRES_USER: tradewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run `make env`}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradewatch -d tradewatch"]
      interval: 3s
      timeout: 3s
      retries: 30
    logging: *default-logging

  redis:
    image: redis:8.8.3-alpine
    # Redis only holds derived, rebuildable state (live views, counters), so
    # persistence is off and the LRU policy bounds memory.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    logging: *default-logging

  marketsim:
    <<: *backend
    command: ["marketsim"]
    environment:
      TW_KAFKA_BROKERS: kafka:9092
      TW_SIM_PACE: realtime
      TW_SIM_SPEED: "1"
      TW_SIM_SESSION_DURATION: 30m
      TW_SIM_CLOSING_WINDOW: 3m
      TW_SIM_RECORD_DIR: /recordings
      # About one record in 2,000 is corrupted on purpose, so the dead-letter
      # topic and sequence-gap handling are visible in the demo.
      TW_SIM_MALFORMED_RATE: "0.0005"
      # Injected abuse: expected episodes per symbol per trading hour, and the
      # probability that a symbol's close is marked in a session.
      TW_SIM_INJECT_WASH_TRADING: "0.6"
      TW_SIM_INJECT_SPOOFING: "0.6"
      TW_SIM_INJECT_MOMENTUM_IGNITION: "0.4"
      TW_SIM_INJECT_QUOTE_STUFFING: "0.6"
      TW_SIM_INJECT_MARKING_THE_CLOSE: "0.25"
      TW_HTTP_ADDR: ":8090"
    volumes:
      - recordings:/recordings
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/marketsim", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  ingest:
    <<: *backend
    command: ["ingest"]
    environment:
      TW_KAFKA_BROKERS: kafka:9092
      TW_HTTP_ADDR: ":8091"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/ingest", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  detector:
    <<: *backend
    command: ["detector"]
    # Two instances share the market_events partitions through the consumer
    # group; scale further with `docker compose up --scale detector=N`.
    deploy:
      replicas: 2
    environment:
      TW_KAFKA_BROKERS: kafka:9092
      TW_DETECTOR_RULES_DIR: /etc/tradewatch/rules
      TW_HTTP_ADDR: ":8092"
    volumes:
      - ./rules:/etc/tradewatch/rules:ro
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/detector", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies the database migrations once and exits; the services that use
  # Postgres start after it succeeds.
  migrate:
    <<: *backend
    command: ["alertsink", "migrate"]
    restart: "no"
    environment:
      TW_POSTGRES_URL: &postgres-url postgres://tradewatch:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run `make env`}@postgres:5432/tradewatch?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  alertsink:
    <<: *backend
    command: ["alertsink"]
    environment:
      TW_KAFKA_BROKERS: kafka:9092
      TW_POSTGRES_URL: *postgres-url
      TW_REDIS_ADDR: redis:6379
      TW_HTTP_ADDR: ":8093"
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/alertsink", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    command: ["api"]
    environment:
      TW_POSTGRES_URL: *postgres-url
      TW_REDIS_ADDR: redis:6379
      TW_API_ADDR: ":8080"
      TW_API_SIM_URL: http://marketsim:8090
      TW_API_PROMETHEUS_URL: http://prometheus:9090
      # As a browser reaches Grafana: the dashboard links to it.
      TW_API_GRAFANA_URL: http://localhost:3001
      TW_API_JWT_SECRET: ${TW_API_JWT_SECRET:?TW_API_JWT_SECRET is not set - run `make env`}
      TW_API_ANALYST_PASSWORD: ${TW_API_ANALYST_PASSWORD:?TW_API_ANALYST_PASSWORD is not set - run `make env`}
      TW_API_ADMIN_PASSWORD: ${TW_API_ADMIN_PASSWORD:?TW_API_ADMIN_PASSWORD is not set - run `make env`}
      TW_HTTP_ADDR: ":8094"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/api", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
    image: tradewatch/web:local
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Scrapes every service's admin port (deploy/compose/prometheus) and
  # evaluates the alerting rules. UI on http://localhost:9090.
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./deploy/compose/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Dashboards provisioned from deploy/compose/grafana, on
  # http://localhost:3001. Anyone who can reach the port may view them;
  # changing anything needs the admin password from .env.
  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is not set - run `make env`}
      GF_SERVER_ROOT_URL: http://localhost:3001/
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/pipeline.json
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./deploy/compose/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/compose/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/compose/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Node toolchain used by `make web-test`. node_modules lives in a volume so
  # that the container's Linux packages never mix with a host install.
  webtools:
    image: node:24.19.0-alpine
    profiles: ["tools"]
    working_dir: /src/web
    volumes:
      - .:/src
      - web-node-modules:/src/web/node_modules

  # Browser used by `make web-e2e` and `make screenshots` against the running
  # dashboard.
  e2e:
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    profiles: ["tools"]
    working_dir: /src/web/e2e
    environment:
      TW_WEB_URL: http://web:8080
      TW_API_ANALYST_PASSWORD: ${TW_API_ANALYST_PASSWORD:?TW_API_ANALYST_PASSWORD is not set - run `make env`}
      TW_API_ADMIN_PASSWORD: ${TW_API_ADMIN_PASSWORD:?TW_API_ADMIN_PASSWORD is not set - run `make env`}
    volumes:
      - .:/src
      - e2e-node-modules:/src/web/e2e/node_modules

  # Go toolchain used by `make test`, `make lint` and `make proto`, so that a
  # machine with only Docker can run them. Not started by `docker compose up`.
  toolbox:
    image: golang:1.26.9-trixie
    profiles: ["tools"]
    working_dir: /src
    environment:
      GOFLAGS: -buildvcs=false
      CGO_ENABLED: "1"
      TW_IT_KAFKA_BROKERS: kafka:9092
      TW_IT_POSTGRES_URL: postgres://tradewatch:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set - run `make env`}@postgres:5432/tradewatch?sslmode=disable
      TW_IT_REDIS_ADDR: redis:6379
    volumes:
      - .:/src
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - go-bin:/go/bin

volumes:
  kafka-data: {}
  postgres-data: {}
  prometheus-data: {}
  recordings: {}
  go-mod-cache: {}
  go-build-cache: {}
  go-bin: {}
  web-node-modules: {}
  e2e-node-modules: {}
